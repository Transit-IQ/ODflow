  <!-- Stamped before first paint so a light-theme session never flashes dark.
       `data-theme` on <html> is the single source of truth for the palette;
       core/theme.js reads the same key and owns it from here on. -->
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
    catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
